[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "new-drug-reimbursement-game"
version = "0.4.0"
description = "Ecosystem-first price-effectiveness and reimbursement-game research software"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "New Drug Reimbursement Game contributors"}]
keywords = ["health economics", "game theory", "reimbursement", "price-effectiveness", "UOGTO"]
dependencies = []

[project.optional-dependencies]
# Voiage is user-owned and authoritative for VOI. It remains optional so the
# deterministic PEA core can run offline and so repository checkout order is
# controllable through ecosystem.lock.toml.
voiage = ["voiage"]
dev = ["basedpyright>=1.39.9", "build==1.5.0", "matplotlib>=3.9", "numpy>=2.0", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.8", "ty>=0.0.66"]

[project.scripts]
ndr-game = "reimbursement_game.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["E501", "RUF001", "RUF002", "S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603", "S607"]
"tests/*.py" = ["S603", "S607"]

[tool.ty.environment]
python-version = "3.11"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
