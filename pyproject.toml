[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-drug-reimbursement-game"
version = "0.3.0"
description = "Ecosystem-first price-effectiveness and reimbursement-game research software"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "New Drug Reimbursement Game contributors"}]
keywords = ["health economics", "game theory", "reimbursement", "price-effectiveness", "UOGTO"]
dependencies = []

[project.optional-dependencies]
# Voiage is user-owned and authoritative for VOI. It remains optional so the
# deterministic PEA core can run offline and so repository checkout order is
# controllable through ecosystem.lock.toml.
voiage = ["voiage"]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
ndr-game = "reimbursement_game.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reimbursement_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
