name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Scope and clean-room validation
        run: python scripts/validate_scope.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate ecosystem lock and discovery contract offline
        run: python scripts/discover_ecosystem.py --check --offline-fixture-mode
      - name: Validate governance and extraction inventories
        run: |
          python scripts/governance_inventory.py --check
          python scripts/validate_extraction.py
      - name: Build and install distribution in a clean environment
        run: python scripts/validate_packaging.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
