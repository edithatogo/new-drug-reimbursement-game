name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull-request runs while allowing the default branch to
# finish. This keeps required checks fast without changing their coverage.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Scope and clean-room validation
        run: python scripts/validate_scope.py
      - name: Unit tests and coverage
        run: python -m pytest --cov=reimbursement_game --cov-report=term --cov-report=xml
      - name: Upload Python coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate ecosystem lock and discovery contract offline
        run: python scripts/discover_ecosystem.py --check --offline-fixture-mode
      - name: Validate governance and extraction inventories
        run: |
          python scripts/governance_inventory.py --check
          python scripts/validate_extraction.py
      - name: Build and install distribution in a clean environment
        run: python scripts/validate_packaging.py
      - name: Ruff
        run: ruff check .
      - name: Routine type check (ty)
        run: ty check src
      - name: Pre-PR type check (basedpyright)
        if: github.event_name == 'pull_request'
        run: basedpyright
      - name: Run repository verification harness
        run: python scripts/run_quality_gate.py --receipt verification-receipt.json
      - name: Upload verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-receipt-${{ github.sha }}
          path: verification-receipt.json
          retention-days: 90
          if-no-files-found: error

  rust:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload Rust coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
