name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull-request runs while allowing the default branch to
# finish. This keeps required checks fast without changing their coverage.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    env:
      UV_PROJECT_ENVIRONMENT: target/dev-python
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.9"
      - name: Install and verify the pinned project environment
        run: |
          uv sync --locked --python "$(cat .python-version)" --extra dev --extra voiage
          target/dev-python/bin/python -I - <<'PYTHON'
          import platform
          import sys
          from pathlib import Path

          expected = Path(".python-version").read_text().strip()
          if platform.python_implementation() != "CPython" or platform.python_version() != expected:
              raise SystemExit(f"Expected CPython {expected}, found {sys.version}")
          if Path(sys.prefix).resolve() != Path("target/dev-python").resolve():
              raise SystemExit(f"Unexpected environment {sys.prefix}")
          print(sys.executable, sys.version)
          PYTHON
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/target/dev-python" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/target/dev-python/bin" >> "$GITHUB_PATH"
      - name: Scope and clean-room validation
        run: python scripts/validate_scope.py
      - name: Unit tests and coverage
        run: python -m pytest --cov=reimbursement_game --cov-report=term --cov-report=xml
      - name: Upload Python coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Validate ecosystem lock and discovery contract offline
        run: python scripts/discover_ecosystem.py --check --offline-fixture-mode
      - name: Validate governance and extraction inventories
        run: |
          python scripts/governance_inventory.py --check
          python scripts/validate_extraction.py
      - name: Build and install distribution in a clean environment
        run: python scripts/validate_packaging.py
      - name: Ruff
        run: ruff check .
      - name: Routine type check (ty)
        run: ty check src
      - name: Pre-PR type check (basedpyright)
        if: github.event_name == 'pull_request'
        run: basedpyright
      - name: Run repository verification harness
        run: python scripts/run_quality_gate.py --receipt verification-receipt.json
      - name: Upload verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-receipt-${{ github.sha }}
          path: verification-receipt.json
          retention-days: 90
          if-no-files-found: error

  rust:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test application against immutable Paignia
        # Generic game packages are Git dependencies maintained in Paignia.
        # This workspace includes the application and paignia_static_game target;
        # complete release/real-model qualification remains separate.
        run: cargo test --workspace --locked
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Collect Rust coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
