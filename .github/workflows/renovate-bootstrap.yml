name: Renovate bootstrap cycle

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log verbosity for this manual cycle
        required: false
        default: info
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: renovate-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_LEVEL: ${{ inputs.log_level }}
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: '["edithatogo/new-drug-reimbursement-game"]'
      RENOVATE_REQUIRE_CONFIG: required
    steps:
      - name: Run one repository-scoped Renovate cycle
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          renovate-version: 44.166.0
          token: ${{ secrets.GITHUB_TOKEN }}
